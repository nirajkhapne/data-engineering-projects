resources:
  jobs:
    gizmobox_lakehouse_pipeline:
      name: GizmoBox Lakehouse Pipeline
      description: Batch backfill + Auto Loader customer arrivals + Silver/Gold transformations and data-quality checks.
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_historical_batch
          job_cluster_key: gizmobox_job_cluster
          notebook_task:
            notebook_path: ../notebooks/01_bronze_batch.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              landing_root: ${var.landing_root}
              checkpoint_root: ${var.checkpoint_root}
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true

        - task_key: bronze_autoloader_customers
          depends_on:
            - task_key: bronze_historical_batch
          job_cluster_key: gizmobox_job_cluster
          notebook_task:
            notebook_path: ../notebooks/02_bronze_autoloader_customers.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              landing_root: ${var.landing_root}
              checkpoint_root: ${var.checkpoint_root}
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true

        - task_key: silver_transformations
          depends_on:
            - task_key: bronze_autoloader_customers
          job_cluster_key: gizmobox_job_cluster
          notebook_task:
            notebook_path: ../notebooks/03_silver_transform.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              landing_root: ${var.landing_root}
              checkpoint_root: ${var.checkpoint_root}
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true

        - task_key: gold_models
          depends_on:
            - task_key: silver_transformations
          job_cluster_key: gizmobox_job_cluster
          notebook_task:
            notebook_path: ../notebooks/04_gold_models.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              landing_root: ${var.landing_root}
              checkpoint_root: ${var.checkpoint_root}
          max_retries: 1
          min_retry_interval_millis: 60000
          retry_on_timeout: true

        - task_key: data_quality_gate
          depends_on:
            - task_key: gold_models
          job_cluster_key: gizmobox_job_cluster
          notebook_task:
            notebook_path: ../notebooks/05_data_quality.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              landing_root: ${var.landing_root}
              checkpoint_root: ${var.checkpoint_root}
          max_retries: 0

      job_clusters:
        - job_cluster_key: gizmobox_job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_id}
            num_workers: 1
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            autotermination_minutes: 15
            custom_tags:
              project: gizmobox-lakehouse
              environment: ${bundle.target}
